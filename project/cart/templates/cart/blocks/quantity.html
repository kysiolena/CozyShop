<div class="quantity-container input-group" data-product="{{ cart_item.product.id }}">
    <button class="quantity-minus btn btn-dark" type="button">-</button>
    <input type="text" class="quantity-input form-control text-center" value="{{ cart_item.quantity }}"
           aria-label="Quantity">
    <button class="quantity-plus btn btn-dark" type="button">+</button>
</div>
