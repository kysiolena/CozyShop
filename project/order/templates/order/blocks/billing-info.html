<div class="pb-4">
    <div class="card">
        <div class="card-header">
            Billing Info
        </div>
        <div id="billing-card-body" class="card-body">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="payment_method" id="pm-card" value="card" checked>
                <label class="form-check-label" for="pm-card">
                    Card
                </label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="payment_method" id="pm-paypal" value="paypal">
                <label class="form-check-label" for="pm-paypal">
                    PayPal
                </label>
            </div>

            <div id="pm-content" class="pt-2">
                {#      Template...         #}
            </div>

            <template id="pm-card-template">
                {% include 'shop/blocks/form.html' with form=billing_form action='order_billing_page' button_hidden=True %}
            </template>
        </div>
    </div>
</div>
