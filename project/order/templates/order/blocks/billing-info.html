<div class="pb-4">
    <div class="card">
        <div class="card-header">
            Billing Info
        </div>
        <div id="billing-card-body" class="card-body">
            {% for pyment_method in pyment_methods %}
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="payment_method" id="pm-{{ pyment_method.value }}"
                           value="{{ pyment_method.value }}"
                           checked>
                    <label class="form-check-label" for="pm-{{ pyment_method.value }}">
                        {{ pyment_method.label }}
                    </label>
                </div>
            {% endfor %}

            <div id="pm-content" class="pt-2">
                {#      Template...         #}
            </div>

            {% for pyment_method in pyment_methods %}
                <template id="pm-{{ pyment_method.value }}-template">
                    {% if pyment_method.value == 'CA' %}
                        {% include 'shop/blocks/form.html' with form=billing_form action='order_billing_page' button_hidden=True %}
                    {% endif %}
                </template>
            {% endfor %}
        </div>
    </div>
</div>
