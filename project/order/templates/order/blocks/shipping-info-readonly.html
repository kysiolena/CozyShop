<div class="pb-4">
    <div class="card">
        <div class="card-header">
            Shipping Info
        </div>
        <ul class="list-group list-group-flush">
            {% for field in shipping_form %}
                <li class="list-group-item d-flex align-items-center justify-content-between">
                    <h5>{{ field.label }}</h5>
                    <p>{{ field.value }}</p>
                </li>
            {% endfor %}
        </ul>
    </div>

    <a href="{% url 'order_checkout_page' %}" class="btn btn-light mt-2">Edit Shipping Info</a>
</div>
