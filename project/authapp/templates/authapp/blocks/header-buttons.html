<div class="d-flex">
    {% if user.is_authenticated %}
        <a href="{% url 'profile_page' %}" class="btn btn-info">Profile</a>
        <form action="{% url 'sign_out_page' %}" method="post">
            {% csrf_token %}
            <button class="btn btn-warning ms-2">Sign Out</button>
        </form>
    {% else %}
        <a href="{% url 'sign_in_page' %}" class="btn btn-success">Sign In</a>
        <a href="{% url 'sign_up_page' %}" class="btn btn-info ms-2">Sign Up</a>
    {% endif %}
</div>
