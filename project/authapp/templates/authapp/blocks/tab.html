<li class="nav-item">
    {% url tab_url as str_tab_url %}
    {% if request.get_full_path == str_tab_url %}
        <a class="nav-link active" aria-current="page" href="{{ str_tab_url }}">
            {{ tab_name }}
        </a>
    {% else %}
        <a class="nav-link" href="{{ str_tab_url }}">
            {{ tab_name }}
        </a>
    {% endif %}
</li>
