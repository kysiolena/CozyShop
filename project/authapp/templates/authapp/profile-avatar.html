{% extends "authapp/layout/profile.html" %}

{% load static %}

{% block form %}
    <div class="mb-4">
        <img src="{{ object.img }}" class="profile-img img-thumbnail"
             alt="{{ user.username|default_if_none:'img' }}">
    </div>

    {% include 'shop/blocks/form.html' with action='profile_avatar_page' enctype='multipart/form-data' button='Save' %}

{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const img = document.querySelector(".profile-img")
            const inputField = document.querySelector("input[name='image']")

            if (inputField && img) {
                inputField.addEventListener("change", (evt) => {
                    const file = evt.target.files[0];
                    const reader = new FileReader();

                    reader.addEventListener("load", (evt) => {
                        img.src = evt.target.result;
                    });

                    if (file) {
                        reader.readAsDataURL(file);
                    } else {
                        img.src = "{% static 'shop/images/image-not-found.png' %}";
                    }
                })
            }
        })
    </script>
{% endblock %}
