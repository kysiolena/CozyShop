<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    {% load static %}

    <link rel="icon" type="image/png" href="{% static 'shop/images/logo.png' %}">

    <link rel="stylesheet" href="{% static 'shop/css/main.css' %}">

    {% block styles %}{% endblock %}
</head>
<body>


<nav class="navbar bg-light sticky-top">
    <div class="container-fluid justify-content-space-between">
        {% include 'authapp/blocks/header-buttons.html' %}

        <a class="navbar-brand" href="{% url 'shop_page' %}">
            <img src="{% static 'shop/images/logo.png' %}"
                 alt="Logo"
                 height="24"
                 class="d-inline-block align-text-top">
            Cozy Shop
        </a>

        <div class=""></div>
    </div>
</nav>

<main class="container">
    {% block main %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

{% block scripts %}{% endblock %}
</body>
</html>
