<ul class="nav nav-pills flex-column" style="top: 56px">
    {% for cat in categories %}
        <li class="nav-item">
            <a class="nav-link {% if cat.slug == category.slug %} active {% endif %}"
                    {% if cat.slug == category.slug %} aria-current="page" {% endif %}
               href="{% url 'category_page' slug=cat.slug %}"
            >
                {{ cat.name }}
            </a>
        </li>
    {% endfor %}


</ul>
