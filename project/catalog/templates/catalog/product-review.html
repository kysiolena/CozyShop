{% extends "shop/layout/base.html" %}

{% block main %}
    <div class="row pt-4">
        <div class="col-3"></div>
        <div class="col-6">
            {% include 'catalog/blocks/button-back-to-product.html' %}

            {% if message %}
                <div class="alert alert-success mb-4" role="alert">
                    {{ message }}
                </div>
            {% endif %}
            <h1 class="">{{ page_name }}</h1>

            <form class="form" action="{% url 'product_review_create_page' slug=product_slug %}" method="post"
                  enctype="multipart/form-data">
                {{ form }}
                {% csrf_token %}

                <button class="btn btn-primary mt-4">Submit</button>
            </form>
        </div>
        <div class="col-3"></div>
    </div>

{% endblock %}
