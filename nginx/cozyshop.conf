server {
    listen 8088; # nginx listener
    charset utf8;

    access_log /app/www/cozyshop/logs/cozyshop_access.log;
    error_log /app/www/cozyshop/logs/cozyshop_error.log error;

        location / {
            proxy_pass http://cozyshop:8000; # Uvicorn port

            proxy_http_version 1.1; # Required for WebSockets
            proxy_set_header Upgrade $http_upgrade; # Required for WebSockets
            proxy_set_header Connection "upgrade"; # Required for WebSockets

            proxy_set_header X-Url-Scheme $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
        }

        location /favicon.ico {
            access_log off;
            log_not_found off;
        }
        location /static/ { root /app/www/cozyshop; }
        location /media/ { root /app/www/cozyshop; }
}